[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-6-astra-skill"
dynamic = ["version"]
description = "Privacy-aware evidence ledger for Codex project and Agent Skill improvement"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GPT-6 Astra Skill contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "tzdata>=2024.1; sys_platform == 'win32'",
]
keywords = [
  "ai",
  "agent-skills",
  "claude-code",
  "codex",
  "conversation-analysis",
  "feedback-loop",
  "project-optimizer",
  "requirements-engineering",
  "skill",
  "vibe-coding",
]

[project.scripts]
gpt6-astra-skill = "requirement_ledger.cli:main"
requirement-ledger = "requirement_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/adand-91/gpt-6-astra-skill"
Documentation = "https://github.com/adand-91/gpt-6-astra-skill#readme"
Repository = "https://github.com/adand-91/gpt-6-astra-skill"
Issues = "https://github.com/adand-91/gpt-6-astra-skill/issues"
Changelog = "https://github.com/adand-91/gpt-6-astra-skill/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "requirement_ledger.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
