[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "requirement-ledger"
version = "0.1.0"
description = "Privacy-first evidence and repair planning for any Git project"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "requirement-ledger contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []
keywords = ["codex", "project-improvement", "requirements", "privacy", "retrospective"]

[project.scripts]
requirement-ledger = "requirement_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/adand-91/requirement-ledger"
Documentation = "https://github.com/adand-91/requirement-ledger#readme"
Repository = "https://github.com/adand-91/requirement-ledger"
Issues = "https://github.com/adand-91/requirement-ledger/issues"
Changelog = "https://github.com/adand-91/requirement-ledger/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
